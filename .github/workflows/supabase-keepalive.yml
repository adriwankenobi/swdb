name: Supabase keepalive

# Keeps the free-tier Supabase project from being paused for inactivity.
# Supabase pauses free projects after 7 days with no *authenticated* database
# activity — anonymous (publishable-key) requests do not count. The ping
# therefore authenticates with the service_role key, which bypasses RLS and is
# sensitive, so it is stored as the repo secret SUPABASE_SERVICE_ROLE_KEY
# rather than in this file. The project URL is public.
#
# The job also commits a timestamp file each run. GitHub disables scheduled
# workflows after 60 days with no repo commits — the self-commit keeps the
# repo (and therefore this schedule) alive indefinitely, hands-off.

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC daily (margin against dropped runs; the real test is surviving past a 7-day window)
  workflow_dispatch: {}    # allows manual runs from the Actions tab

permissions:
  contents: write # needed for the keep-schedule-alive commit

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Ping Supabase (write heartbeat)
        env:
          SUPABASE_URL: https://uimsujgusfnvbtictvtx.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Fail loudly if the secret is missing, rather than silently pinging
          # anonymously (which does not count as activity).
          if [ -z "${SUPABASE_KEY}" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY secret is not set" >&2
            exit 1
          fi
          # Call keepalive_ping(): a SECURITY DEFINER function that upserts the
          # heartbeat row and returns the timestamp it wrote (see
          # supabase/setup.sql: `keepalive`). Authenticated with the service_role
          # key, this counts as project activity. -f fails the job on any
          # non-2xx; --retry-all-errors so a transient runner DNS hiccup (curl
          # exit 6) retries instead of failing outright.
          curl -fsS -X POST \
            --retry 5 --retry-delay 10 --retry-all-errors --max-time 30 \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            "${SUPABASE_URL}/rest/v1/rpc/keepalive_ping"
          echo # newline after the returned timestamp

      - name: Keep the schedule alive
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-keepalive.txt
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/last-keepalive.txt
          # No-op if the file is somehow unchanged (e.g. two runs same second).
          git commit -m "chore: supabase keepalive $(date -u +%F)" || exit 0
          git push
