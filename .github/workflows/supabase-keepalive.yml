name: Supabase keepalive

# Keeps the free-tier Supabase project from being paused for inactivity.
# Supabase pauses free projects that lack "sufficient" database activity over a
# 7-day window, so this runs several times a day and sends a burst of writes
# each run to keep the request volume up. Each write calls keepalive_ping()
# authenticated with the service_role key, which bypasses RLS and is sensitive,
# so it is stored as the repo secret SUPABASE_SERVICE_ROLE_KEY rather than in
# this file. The project URL is public.
#
# The job also makes an empty commit, but ONLY when the repo has had no commits
# for ~45 days. GitHub disables scheduled workflows after 60 days with no repo
# commits; this self-sustaining commit (it counts its own past commits, so it
# needs no other repo activity) keeps the schedule enabled indefinitely, while
# staying dormant whenever normal work is happening.

on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours (00/06/12/18 UTC) — activity spread across the day
  workflow_dispatch: {}    # allows manual runs from the Actions tab

permissions:
  contents: write # needed for the keep-schedule-alive commit

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Ping Supabase (write heartbeat)
        env:
          SUPABASE_URL: https://uimsujgusfnvbtictvtx.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Fail loudly if the secret is missing, rather than silently pinging
          # anonymously (which does not count as activity).
          if [ -z "${SUPABASE_KEY}" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY secret is not set" >&2
            exit 1
          fi
          url="${SUPABASE_URL}/rest/v1/rpc/keepalive_ping"
          auth=(-H "apikey: ${SUPABASE_KEY}" -H "Authorization: Bearer ${SUPABASE_KEY}" -H "Content-Type: application/json")
          # Burst of writes to raise the daily request volume. Each call is a
          # keepalive_ping() upsert (SECURITY DEFINER; see supabase/setup.sql).
          # Individual blips are tolerated; the job fails only if EVERY write
          # fails, so a transient hiccup does not break the keepalive.
          ok=0
          for i in $(seq 1 50); do
            if curl -fsS --max-time 20 -X POST "${auth[@]}" "$url" >/dev/null; then
              ok=$((ok + 1))
            fi
          done
          echo "successful writes this run: ${ok}/50"
          if [ "$ok" -eq 0 ]; then
            echo "all keepalive writes failed" >&2
            exit 1
          fi

      - name: Keep the schedule alive (only if the repo has been idle ~45 days)
        run: |
          # GitHub auto-disables a scheduled workflow after 60 days with no repo
          # commits. Make an empty commit ONLY when the latest commit (yours or
          # a previous keepalive one) is older than 45 days, so this stays fully
          # dormant during normal work and fires at most once per idle window.
          head_epoch=$(git log -1 --format=%ct HEAD)
          age_days=$(( ( $(date -u +%s) - head_epoch ) / 86400 ))
          if [ "$age_days" -lt 45 ]; then
            echo "last commit ${age_days}d ago; schedule safe, nothing to do"
            exit 0
          fi
          echo "repo idle ${age_days}d; empty commit to keep the schedule enabled"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled keepalive workflow enabled"
          git push
